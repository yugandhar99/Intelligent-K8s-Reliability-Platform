apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: {{ include "reliability.name" . }}
automountServiceAccountToken: false
{{- if .Values.configReader.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: {{ include "reliability.name" . }}-config-reader
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: {{ include "reliability.name" . }}-config-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "reliability.name" . | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: {{ include "reliability.name" . }}-config-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "reliability.name" . }}-config-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "reliability.name" . }}-config-reader
{{- end }}
