apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: {{ include "reliability.name" . }}
  labels:
    {{- include "reliability.selector" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "reliability.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "reliability.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "reliability.name" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform
          image: {{ include "reliability.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "reliability.containerSecurity" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef:
                name: {{ include "reliability.name" . }}
          {{- with .Values.existingOperatorSecret }}
          env:
            - name: AIOPS_OPERATOR_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: operator-tokens
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/reliability}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (include "reliability.name" .) .Values.persistence.existingClaim | quote }}
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
