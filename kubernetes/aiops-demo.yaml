apiVersion: apps/v1 
kind: Deployment
metadata:
  name: aiops-crash-demo
  namespace: reliability-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-crash-demo
  template:
    metadata:
      labels:
        app: aiops-crash-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: deliberate-exit
          image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
          command: ["/bin/sh", "-c", "exit 12"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-pending-demo
  namespace: reliability-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-pending-demo
  template:
    metadata:
      labels:
        app: aiops-pending-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: deliberately-unschedulable
          image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
          resources:
            requests:
              cpu: "1000000"
              memory: 8Mi
