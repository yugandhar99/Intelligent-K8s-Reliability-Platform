apiVersion: v1
kind: Namespace
metadata:
  name: reliability-lab 
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maintenance
  namespace: reliability-lab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reliability-lab-discovery
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes"]
    resourceNames: ["k8s-reliability-lab-worker", "k8s-reliability-lab-worker2", "k8s-reliability-lab-worker3"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reliability-lab-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: reliability-lab-discovery
subjects:
  - kind: ServiceAccount
    name: maintenance
    namespace: reliability-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maintenance
  namespace: reliability-lab
rules:
  - apiGroups: [""]
    resources: ["pods/eviction", "events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maintenance
  namespace: reliability-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maintenance
subjects:
  - kind: ServiceAccount
    name: maintenance
    namespace: reliability-lab
