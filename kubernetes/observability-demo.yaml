apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-probe
  namespace: reliability-lab
spec:
  replicas: 2
  selector:
    matchLabels: {app: observability-probe}
  template:
    metadata:
      labels: {app: observability-probe}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          command:
            - /bin/sh
            - -c
            - printf ok >/usr/share/nginx/html/observability-healthz && exec nginx -g 'daemon off;'
          readinessProbe:
            httpGet: {path: /observability-healthz, port: 80}
            periodSeconds: 2
            failureThreshold: 2
          resources:
            requests: {cpu: 40m, memory: 32Mi}
            limits: {memory: 64Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: observability-probe
  namespace: reliability-lab
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: observability-probe}
