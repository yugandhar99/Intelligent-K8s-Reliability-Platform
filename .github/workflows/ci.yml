name: DevSecOps validation
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - run: "pip install --require-hashes --only-binary=:all: -r requirements-ci.lock"
      - run: |
          ruff check --select E9,F63,F7,F82 app tests
          ruff check deploy tests/test_deployment.py
          ruff format --check deploy tests/test_deployment.py app/process_lock.py
          python -m pytest -q
      - run: |
          python -m pip_audit --require-hashes -r requirements.lock
          python -m pip_audit --require-hashes -r requirements-ci.lock

  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: |
          python3 deploy/install_tools.py "$RUNNER_TEMP/reliability-bin" helm terraform trivy actionlint gitleaks
          printf '%s\n' "$RUNNER_TEMP/reliability-bin" >> "$GITHUB_PATH"
      - run: |
          actionlint
          gitleaks git --redact --no-banner --log-opts="--all"
          terraform fmt -check -recursive deploy/terraform
          terraform -chdir=deploy/terraform/environments/local init -backend=false -lockfile=readonly
          terraform -chdir=deploy/terraform/environments/local validate
          chart=deploy/helm/reliability
          helm lint "$chart" -f "$chart/values-development.yaml"
          helm template stage7 "$chart" --namespace stage7-tf-testing -f "$chart/values-testing.yaml" > "$RUNNER_TEMP/testing.yaml"
          digest="sha256:$(printf '%064d' 0)"
          helm template stage7 "$chart" --namespace stage7-tf-testing -f "$chart/values-production.yaml" --set-string "image.digest=$digest" > "$RUNNER_TEMP/production.yaml"
          trivy config --severity HIGH,CRITICAL --exit-code 1 "$RUNNER_TEMP/testing.yaml"
          trivy config --severity HIGH,CRITICAL --exit-code 1 "$RUNNER_TEMP/production.yaml"
          trivy config --severity HIGH,CRITICAL --exit-code 1 deploy/terraform
          trivy config --severity HIGH,CRITICAL --exit-code 1 Dockerfile
          docker run --rm --entrypoint /bin/promtool \
            -v "$GITHUB_WORKSPACE/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus \
            prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 test rules rules.test.yml

  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: "pip install --require-hashes --only-binary=:all: -r requirements-ci.lock"
      - run: |
          python deploy/install_tools.py "$RUNNER_TEMP/reliability-bin" kind helm terraform
          printf '%s\n' "$RUNNER_TEMP/reliability-bin" >> "$GITHUB_PATH"
      - run: |
          mkdir -p data
          kind create cluster --name k8s-reliability-lab --config kubernetes/kind.yaml --kubeconfig data/kind-admin.yaml --wait 180s
          python kubernetes/bootstrap.py
      - run: RUN_KIND_TESTS=1 python -m pytest -q
      - run: |
          docker build --tag reliability-platform:stage7-local .
          kind load docker-image reliability-platform:stage7-local --name k8s-reliability-lab
          python deploy/verify_lab.py
          terraform -chdir=deploy/terraform/environments/local init -backend=false -lockfile=readonly
          terraform -chdir=deploy/terraform/environments/local plan -input=false -var-file=testing.tfvars.example -out="$PWD/data/kind.tfplan"
          terraform -chdir=deploy/terraform/environments/local apply -input=false "$PWD/data/kind.tfplan"
          python deploy/helm_lifecycle.py --namespace stage7-tf-testing

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: |
          python3 deploy/install_tools.py "$RUNNER_TEMP/reliability-bin" helm trivy
          printf '%s\n' "$RUNNER_TEMP/reliability-bin" >> "$GITHUB_PATH"
      - run: |
          docker build --tag reliability-platform:stage7-local .
          trivy image --scanners secret --format json --output "$RUNNER_TEMP/image-secrets.json" --exit-code 1 reliability-platform:stage7-local
          mkdir artifacts
          trivy image --format cyclonedx --output artifacts/platform.cdx.json reliability-platform:stage7-local
          trivy image --scanners vuln --format json --output artifacts/image-scan.json reliability-platform:stage7-local
          helm package deploy/helm/reliability --destination artifacts
          (cd artifacts && sha256sum -- *.tgz *.json > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - run: trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 reliability-platform:stage7-local
